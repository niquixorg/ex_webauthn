name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15", "2.16", "2.17"]
        job:
          - { target: aarch64-apple-darwin,       os: macos-15 }
          - { target: x86_64-apple-darwin,        os: macos-15 }
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-24.04,  use-cross: true }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-24.04,  use-cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04,  use-cross: true }
          - { target: x86_64-pc-windows-msvc,     os: windows-2025 }

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install Rust target (macOS x86 cross-compile)
        if: matrix.job.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Setup Perl (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install strawberryperl -y
          echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the project
        id: build
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: ex_webauthn_native
          project-dir: "."
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-version: ${{ steps.version.outputs.version }}
          cargo-args: "--package ex_webauthn_native"
        env:
          RUSTFLAGS: ${{ contains(matrix.job.target, 'musl') && '-C target-feature=-crt-static' || '' }}

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.file-path }}

  publish:
    name: Publish to Hex
    needs: build_release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - name: Install dependencies
        run: mix deps.get

      - name: Generate checksums
        run: mix rustler_precompiled.download ExWebauthn.Native --all --print

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}