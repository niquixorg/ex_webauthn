[package]
name = "ex_webauthn_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"
serde_json = "1"
url = "2"
parking_lot = "0.12"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true